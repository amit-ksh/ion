[package]
name = "waku-credentials"
version = "0.1.0"
edition = "2024"
description = "Shared OS vault boundary for ion desktop and daemon"
license = "GPL-3.0-only"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
dirs = "6.0"
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "time", "net"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
