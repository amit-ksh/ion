    function topbar(){let task=tasks.find(t=>t.id===state.task);let title=state.page==='task'?(task?.title||'New Task'):state.page[0].toUpperCase()+state.page.slice(1);return `<header class="topbar"><div class="topbar-title">${e(title)}</div><div class="topbar-gap"></div>${state.page!=='task'?`<select id="project-filter" class="topfilter" aria-label="Project filter"><option value="all" ${state.project==='all'?'selected':''}>All projects</option>${Object.entries(projectNames).map(([id,n])=>`<option value="${id}" ${state.project===id?'selected':''}>${e(n)}</option>`).join('')}</select>`:''}<button class="iconbtn" data-act="search" aria-label="Search">${icon('search')}</button><div class="window-controls"><button class="iconbtn" aria-label="Minimize" data-act="window">${icon('min')}</button><button class="iconbtn" aria-label="Maximize" data-act="window">${icon('max')}</button><button class="iconbtn" aria-label="Close" data-act="window">${icon('close')}</button></div></header>`}
    function dashboard(){let active=agents.filter(a=>a.status==='Running');let blocked=tasks.filter(t=>byProject(t)&&t.status==='Blocked').length;return `<div class="page">${header('Dashboard')}<div class="summary-grid"><div class="summary-cell"><strong>${decisions.filter(d=>d.status==='Now'&&byProject(d)).length}</strong><span>Decisions needed</span></div><div class="summary-cell"><strong>${active.length}</strong><span>Agents running</span></div><div class="summary-cell"><strong>${tasks.filter(byProject).filter(t=>t.status==='Running').length}</strong><span>Tasks in progress</span></div><div class="summary-cell"><strong>${blocked}</strong><span>Blocked tasks</span></div><div class="summary-cell"><strong>${state.project==='all'?2:1}</strong><span>Active projects</span></div></div>${decisions.some(d=>d.status==='Now'&&byProject(d))?`<div class="attention">${icon('alert')}<div class="text"><strong>${decisions.filter(d=>d.status==='Now'&&byProject(d)).length} decisions need you</strong><small>${e(decisions.find(d=>d.status==='Now'&&byProject(d)).title)} · ${e(projectNames[decisions.find(d=>d.status==='Now'&&byProject(d)).project])}</small></div>${button('Review decisions','page','small',`data-page="decisions"`)}</div>`:''}<div class="section-head"><h2>Agents</h2>${button('Open Teams','page','small quiet',`data-page="teams"`)}</div><div class="agent-strip">${agents.map(a=>`<button class="agent-card" data-act="agent" data-id="${a.id}"><div class="title">${avatar(a.name,a.tone)}<span>${e(a.name)}</span><span class="status-dot ${a.status==='Waiting'?'warn':a.status==='Idle'?'muted':''}"></span></div><div class="task">${e(a.task)}</div><div class="meta">${e(a.status)} · ${e(a.host)}</div></button>`).join('')}</div><div class="dash-columns"><section><div class="section-head"><h2>Tasks</h2>${button('New Task','new-task','small quiet')}</div><div class="list-surface">${tasks.filter(byProject).map(t=>`<button class="list-row" data-act="task" data-id="${t.id}">${icon('tasks')}<span class="body"><span class="title">${e(t.title)}</span><span class="sub">${e(projectNames[t.project])} · ${e(t.updated)}</span></span>${tag(t.status,statusTone(t.status))}</button>`).join('')}</div></section><section><div class="section-head"><h2>Projects</h2></div><div class="list-surface">${Object.entries(projectNames).filter(([id])=>state.project==='all'||state.project===id).map(([id,n])=>`<div class="project-status"><strong>${e(n)}</strong><span class="tiny faint">${tasks.filter(t=>t.project===id).length} tasks</span><small>${tasks.filter(t=>t.project===id&&t.status==='Running').length} running · ${tasks.filter(t=>t.project===id&&t.status==='Blocked').length} blocked</small>${button('Open','project','small quiet',`data-id="${id}"`)}</div>`).join('')}</div></section></div></div>`}
    function decisionsView(){let rows=decisions.filter(d=>d.status===state.decisionTab&&byProject(d));let selected=rows.find(d=>d.id===state.selectedDecision)||rows[0];return `<div class="page narrow">${header('Decisions','Actions waiting across your projects')}<div class="tabs">${['Now','Later','Resolved'].map(v=>`<button class="tab ${state.decisionTab===v?'active':''}" data-act="decision-tab" data-id="${v}">${v}${v==='Now'?` · ${decisions.filter(d=>d.status==='Now'&&byProject(d)).length}`:''}</button>`).join('')}</div>${rows.length?`<div class="split"><div class="split-left">${rows.map(d=>`<button class="split-item ${selected?.id===d.id?'selected':''}" data-act="decision-select" data-id="${d.id}"><div style="display:flex;justify-content:space-between;gap:7px"><strong>${e(d.title)}</strong>${tag(d.type,d.type==='Exact action'?'warn':'')}</div><div class="meta">${e(projectNames[d.project])} · ${e(d.actor)} · ${e(d.age)}</div></button>`).join('')}</div><div class="detail"><h2>${e(selected.title)}</h2><p>${e(projectNames[selected.project])} · ${e(selected.actor)} · ${e(selected.age)}</p><h3>Exact effect</h3><div class="effect mono">${e(selected.effect)}</div><h3>Why this needs approval</h3><p>${e(selected.reason)}</p><div class="kv"><span>Blocked work</span><span>${e(selected.blocked)}</span></div><div class="kv"><span>Decision type</span><span>${e(selected.type)}</span></div><div class="actions">${selected.status==='Now'?`${button('Approve','decision-approve','primary',`data-id="${selected.id}"`)}${button('Request changes','decision-revise','',`data-id="${selected.id}"`)}${button('Later','decision-later','quiet',`data-id="${selected.id}"`)}`:selected.status==='Later'?button('Move to Now','decision-now','',`data-id="${selected.id}"`):tag('Resolved','good')}</div></div></div>`:'<div class="empty">No decisions in this view.</div>'}</div>`}
    function inboxView(){let rows=inbox.filter(n=>byProject(n)&&(state.inboxTab==='All'||state.inboxTab==='Unread'&&!n.read||state.inboxTab===n.kind));return `<div class="page narrow">${header('Inbox','Updates from tasks, agents, routines, and pipelines',button('Mark all read','inbox-all','small quiet'))}<div class="tabs">${['Unread','All','Issue','Completed','Decision','Artifact'].map(v=>`<button class="tab ${state.inboxTab===v?'active':''}" data-act="inbox-tab" data-id="${v}">${v}</button>`).join('')}</div>${rows.length?`<div class="list-surface">${rows.map(n=>`<button class="list-row" data-act="inbox-open" data-id="${n.id}"><span class="status-dot ${n.read?'muted':n.kind==='Issue'?'warn':'accent'}"></span><span class="body"><span class="title">${e(n.title)}</span><span class="sub">${e(projectNames[n.project])} · ${e(n.kind)}</span></span><span class="right">${e(n.time)}</span>${icon('open','sm')}</button>`).join('')}</div>`:'<div class="empty">No notifications in this view.</div>'}</div>`}
    function teamsView(){let visibleTeams=teams.filter(byProject),team=visibleTeams.find(t=>t.id===state.team)||visibleTeams[0];return `<div class="page">${header('Teams','Agents, expertise, delegation, and access',`${button(`${icon('add','sm')} New agent`,'agent-new','')}${button(`${icon('add','sm')} New team`,'team-new','primary')}`)}<div class="split"><div><div class="section-head" style="margin-top:0"><h2>Teams</h2><span class="faint tiny">${teams.length}</span></div><div class="split-left">${teams.filter(byProject).map(t=>`<button class="split-item ${team?.id===t.id?'selected':''}" data-act="team-select" data-id="${t.id}"><div style="display:flex;justify-content:space-between;gap:8px"><strong>${e(t.name)}</strong>${tag(t.status,statusTone(t.status))}</div><div class="meta">${e(projectNames[t.project])} · ${t.members.length} agents · ${e(t.budget)}</div></button>`).join('')}</div><div class="section-head"><h2>Agents</h2><span class="faint tiny">${agents.length}</span></div><div class="list-surface">${agents.map(a=>`<button class="list-row" data-act="agent" data-id="${a.id}">${avatar(a.name,a.tone)}<span class="body"><span class="title">${e(a.name)}</span><span class="sub">${e(a.role)}</span></span>${tag(a.status,statusTone(a.status))}</button>`).join('')}</div></div>${team?`<div class="detail"><div style="display:flex;justify-content:space-between;gap:12px"><div><h2>${e(team.name)}</h2><p>${e(projectNames[team.project])} · Version 1</p></div>${tag(team.status,statusTone(team.status))}</div><h3>Instructions</h3><p>${e(team.instructions)}</p><div class="two-col" style="margin-top:17px"><div class="mini-panel"><h3>Lead</h3><p>${e(agents.find(a=>a.id===team.lead)?.name||'None')}</p></div><div class="mini-panel"><h3>Run limit</h3><p>${e(team.budget)} · Desktop</p></div></div><h3>Delegation</h3>${team.members.map(id=>{let a=agents.find(x=>x.id===id);return a?`<div class="roster-row">${avatar(a.name,a.tone)}<div class="grow"><div class="title">${e(a.name)} ${id===team.lead?tag('Lead'):''}</div><div class="sub">${e(a.role)} · ${e(a.access)}</div></div><button class="iconbtn" data-act="agent" data-id="${id}" aria-label="Open ${e(a.name)}">${icon('open')}</button></div>`:''}).join('')}<div class="actions">${button('New task with team','new-task','primary')}</div></div>`:'<div class="empty">Select a team.</div>'}</div></div>`}
    function routinesView(){let rows=routines.filter(r=>byProject(r)&&(state.routineTab==='All'||r.status===state.routineTab));return `<div class="page narrow">${header('Routines','Scheduled work for agents',button(`${icon('add','sm')} New routine`,'routine-new','primary'))}<div class="tabs">${['All','Active','Paused','Draft'].map(v=>`<button class="tab ${state.routineTab===v?'active':''}" data-act="routine-tab" data-id="${v}">${v}</button>`).join('')}</div>${rows.length?`<div class="list-surface">${rows.map(r=>`<div class="list-row"><span class="body"><span class="title">${e(r.title)}</span><span class="sub">${e(projectNames[r.project])} · ${e(r.agent)} · ${e(r.schedule)}</span></span><span class="right">Next ${e(r.next)}</span>${tag(r.status,statusTone(r.status))}<button class="iconbtn" data-act="routine-detail" data-id="${r.id}" aria-label="Open ${e(r.title)}">${icon('open')}</button></div>`).join('')}</div>`:'<div class="empty">No routines in this view.</div>'}</div>`}
    function pipelinesView(){let rows=pipelines.filter(byProject);let p=rows.find(x=>x.id===state.pipeline)||rows[0];return `<div class="page">${header('Pipelines','Repeatable workflows for each project',button(`${icon('add','sm')} New pipeline`,'pipeline-new','primary'))}${rows.length?`<div class="split"><div class="split-left">${rows.map(x=>`<button class="split-item ${p.id===x.id?'selected':''}" data-act="pipeline-select" data-id="${x.id}"><div style="display:flex;justify-content:space-between;gap:8px"><strong>${e(x.title)}</strong>${tag(x.version)}</div><div class="meta">${e(projectNames[x.project])} · ${e(x.status)}</div></button>`).join('')}</div><div class="detail"><div style="display:flex;justify-content:space-between;gap:12px"><div><h2>${e(p.title)}</h2><p>${e(projectNames[p.project])} · ${e(p.version)} · ${e(p.last)}</p></div>${tag(p.status,statusTone(p.status))}</div><h3>Stages</h3><div class="pipeline-steps">${p.stages.map((s,i)=>`<div class="step ${i<p.current?'done':i===p.current?'current':''}">${icon(i<p.current?'check':i===p.current?'alert':'time')}<strong>${e(s)}</strong><small>${i<p.current?'Completed':i===p.current?'Waiting':'Queued'}</small></div>`).join('')}</div><h3>Current run</h3><div class="kv"><span>Current stage</span><span>${e(p.stages[p.current]||'Complete')}</span></div><div class="kv"><span>Decision gate</span><span>${p.status==='Waiting for approval'?'Approve release publish':'None'}</span></div><div class="actions">${p.status==='Waiting for approval'?button('Review decision','page','primary',`data-page="decisions"`):button('Start run','pipeline-run','primary',`data-id="${p.id}"`)}</div></div></div>`:'<div class="empty">No pipelines for this project.</div>'}</div>`}
    function artifactsView(){let rows=artifacts.filter(a=>byProject(a)&&(state.artifactType==='All'||a.type===state.artifactType));return `<div class="page">${header('Artifacts','Outputs across tasks and projects')}<div class="tool-row" style="margin-bottom:15px"><div class="field"><label for="artifact-kind">Type</label><select id="artifact-kind">${['All','Report','File reference'].map(v=>`<option ${state.artifactType===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="table artifact-table"><div class="table-header"><span>Name</span><span>Project</span><span>Agent</span><span>Type</span><span>Created</span></div>${rows.map(a=>`<button class="table-row" data-act="artifact" data-id="${a.id}"><span><strong>${e(a.title)}</strong><br><span class="faint">${e(a.storage)}</span></span><span>${e(projectNames[a.project])}</span><span>${e(a.agent)}</span><span>${e(a.type)}</span><span class="faint">${e(a.time)}</span></button>`).join('')}</div>${!rows.length?'<div class="empty">No artifacts match this filter.</div>':''}</div>`}
    function usageView(){let bars=[35,51,44,71,59,76,63,48,80,64,92,75,83,58];return `<div class="page">${header('Usage & costs','Agent, model, and harness activity',`<select id="usage-period" aria-label="Usage period">${['7 days','30 days','90 days'].map(v=>`<option ${state.usagePeriod===v?'selected':''}>${v}</option>`).join('')}</select>`)}<div class="summary-grid"><div class="summary-cell"><strong>54.8k</strong><span>Tokens</span></div><div class="summary-cell"><strong>$0.26</strong><span>Estimated model cost</span></div><div class="summary-cell"><strong>48</strong><span>Model calls</span></div><div class="summary-cell"><strong>7</strong><span>Agent runs</span></div><div class="summary-cell"><strong>0</strong><span>Budget incidents</span></div></div><div class="section-head"><h2>Model activity</h2><span class="faint tiny">Estimated · BYOK</span></div><div class="surface" style="padding:19px 19px 36px"><div class="usage-bars">${bars.map((v,i)=>`<button type="button" style="height:${v}%" title="Day ${i+1}: ${v}% activity"><span>${i===0?'Sep 17':i===6?'Sep 23':i===13?'Sep 30':''}</span></button>`).join('')}</div><div class="usage-caption">Model responses by day</div></div><div class="section-head"><h2>By agent</h2></div><div class="table usage-table"><div class="table-header"><span>Agent</span><span>Model</span><span>Harness</span><span>Tokens</span><span>Est. cost</span></div>${usage.map(u=>`<div class="table-row"><span><strong>${e(u.agent)}</strong><div class="barline" style="max-width:120px;margin-top:6px"><span style="width:${u.width}%"></span></div></span><span>${e(u.model)}</span><span>${e(u.harness)}</span><span class="num">${e(u.tokens)}</span><span class="num">${e(u.cost)}</span></div>`).join('')}</div></div>`}
    function taskView(){let t=tasks.find(x=>x.id===state.task)||tasks[0];let team=teams.find(x=>x.id===t.team);return `<div class="task-layout"><div class="transcript"><div class="transcript-scroll"><div class="transcript-inner"><div class="message user"><div class="who">You</div><p>${e(t.prompt||t.title+'. Have the team plan the work, delegate by expertise, and bring decisions back to me.')}</p></div><div class="message"><div class="who">Lead · ${e(projectNames[t.project])}</div><p>I split the work into research, implementation, and review. The plan is waiting for your approval.</p><div class="effect">Researcher → inspect source and document constraints\nEngineer → implement within approved paths\nReviewer → inspect diff and targeted checks</div>${button('Open decision','page','small',`data-page="decisions"`)}</div><div class="message"><div class="who">Researcher</div><p>Workspace access map saved to Artifacts.</p>${button('Open artifact','artifact','small quiet',`data-id="a1"`)}</div>${state.taskMessages.map(m=>`<div class="message user"><div class="who">You</div><p>${e(m)}</p></div>`).join('')}</div></div><div class="composer-wrap"><div class="composer"><textarea id="composer" placeholder="Message the team…" aria-label="Message the team"></textarea><div class="composer-foot"><span>${e(team?.name||'Solo')}</span><span>·</span><span>Nemotron</span><span class="push"></span><button class="iconbtn" data-act="send" aria-label="Send message">${icon('arrow-up')}</button></div></div></div></div><aside class="task-rail"><h2>Team work</h2>${agents.map(a=>`<div class="roster-row">${avatar(a.name,a.tone)}<div class="grow"><div class="title">${e(a.name)}</div><div class="sub">${e(a.status)} · ${e(a.role)}</div></div></div>`).join('')}<div class="section-head"><h2>Artifacts</h2></div>${artifacts.filter(a=>a.task===t.id).map(a=>`<button class="list-row" data-act="artifact" data-id="${a.id}">${icon('file')}<span class="body"><span class="title">${e(a.title)}</span></span></button>`).join('')}</aside></div>`}
    function renderPage(){switch(state.page){case 'dashboard':return dashboard();case 'decisions':return decisionsView();case 'inbox':return inboxView();case 'teams':return teamsView();case 'routines':return routinesView();case 'pipelines':return pipelinesView();case 'artifacts':return artifactsView();case 'usage':return usageView();case 'task':return taskView();default:return dashboard()}}
    function drawer(title,body,foot=''){return `<div class="veil" data-backdrop="1"><aside class="drawer" role="dialog" aria-modal="true" aria-label="${e(title)}"><div class="drawer-head"><h2>${e(title)}</h2><button class="iconbtn" data-act="close" aria-label="Close">${icon('close')}</button></div><div class="drawer-body">${body}</div>${foot?`<div class="drawer-foot">${foot}</div>`:''}</aside></div>`}
    function field(id,label,value='',type='text',extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${e(value)}" ${extra}></div>`}
    function selectField(id,label,options){return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${options.map(([v,l])=>`<option value="${e(v)}">${e(l)}</option>`).join('')}</select></div>`}
    function renderDrawer(){let d=state.drawer;if(!d)return '';if(d==='new-task')return drawer('New Task',`<div class="drawer-section"><div class="form-grid">${selectField('task-project','Project',Object.entries(projectNames))}${selectField('task-team','Run with',[['solo','Solo'],...teams.map(t=>[t.id,t.name])])}</div></div><div class="drawer-section"><div class="field"><label for="task-title">Task</label><input id="task-title" placeholder="What needs to be done?"></div><div class="field"><label for="task-prompt">Instructions</label><textarea id="task-prompt" placeholder="Outcome, constraints, and acceptance criteria"></textarea></div></div>`,`${button('Cancel','close','quiet')}${button('Create task','task-save','primary')}`);
      if(d==='agent-new')return drawer('New agent',`<div class="drawer-section"><h3>Profile</h3>${field('agent-name','Name')}${field('agent-purpose','Expertise')}<div class="field"><label for="agent-instructions">Instructions</label><textarea id="agent-instructions" placeholder="What this agent is responsible for and what it should return"></textarea></div></div><div class="drawer-section"><h3>Execution</h3><div class="form-grid">${selectField('agent-model','Model',[['Nemotron','Nemotron']])}${selectField('agent-host','Host',[['Desktop','Desktop'],['Personal cloud','Personal cloud']])}${field('agent-budget','Per-run token cap','10,000','number')}</div></div><div class="drawer-section"><h3>Access</h3>${field('agent-paths','Workspace paths','Project workspace')}<label class="checkline"><input id="grant-read" type="checkbox" checked>Read project files</label><label class="checkline"><input id="grant-write" type="checkbox">Edit approved paths</label><label class="checkline"><input id="grant-web" type="checkbox">Web search</label><label class="checkline"><input id="grant-github" type="checkbox">GitHub connected app</label><p>Changes outside these grants require a decision.</p></div>`,`${button('Cancel','close','quiet')}${button('Save agent','agent-save','primary')}`);

    function workflowStagesFromPrompt(prompt,apps){
      const parts=prompt.split(/\bthen\b|[,;.!?\n]|\band\b/i).map(s=>s.trim().replace(/^to\s+/i,'')).filter(Boolean);
      return parts.map(part=>{
        const lower=part.toLowerCase();
        const kind=/approv|sign.off/.test(lower)?'Human approval':/check|test|verify|validat/.test(lower)?'Validation':/publish|deploy|post|send|upload/.test(lower)?'App action':'Agent task';
        const namedApp=apps.find(app=>lower.includes(app.toLowerCase()));
        const app=kind==='Human approval'?'ion':namedApp||(kind==='App action'?apps[0]||'Local workspace':'Local workspace');
        const owner=kind==='Human approval'?'You':kind==='Validation'?'Reviewer':kind==='App action'?'Lead':'Engineer';
        return {title:part[0].toUpperCase()+part.slice(1),kind,owner,app,approval:kind==='Human approval'||/publish|deploy|release|merge/.test(lower)};
      });
    }
    pipelinesView=function(){
      const rows=pipelines.filter(byProject),p=rows.find(x=>x.id===state.pipeline)||rows[0];
      return `<div class="page">${header('Workflows','',button(`${icon('add','sm')} New workflow`,'pipeline-new','primary'))}
        ${rows.length?`<div class="split"><div class="split-left">${rows.map(w=>`<button class="split-item ${p.id===w.id?'selected':''}" data-act="pipeline-select" data-id="${w.id}"><div style="display:flex;justify-content:space-between;gap:8px"><strong>${e(w.title)}</strong>${tag(w.version)}</div><div class="meta">${e(projectNames[w.project])} · ${e(w.status)}</div></button>`).join('')}</div>
          <div class="detail"><div style="display:flex;justify-content:space-between;gap:8px"><div><h2>${e(p.title)}</h2><p>${e(projectNames[p.project])} · ${e(p.version)} · ${e(p.last)}</p></div>${tag(p.status,statusTone(p.status))}</div>
            <h3>Workflow request</h3><div class="workflow-prompt">${e(p.prompt)}</div>
            <h3>Connected apps</h3><div class="tool-row">${tag('Local workspace')}${p.apps.map(app=>tag(app,'blue')).join('')}</div>
            <h3>Stages</h3>${p.stages.map((s,i)=>`<button class="workflow-stage" data-act="workflow-stage" data-id="${p.id}" data-index="${i}"><span class="num">${i+1}</span><span><strong>${e(s.title)}</strong><small>${e(s.kind)} · ${e(s.owner)} · ${e(s.app)}</small></span>${s.approval?tag('Approval','warn'):icon('open','sm')}</button>`).join('')}
            <div class="actions">${button('Add stage','workflow-add-stage','small',`data-id="${p.id}"`)}${p.status==='Waiting for approval'?button('Review decision','page','primary',`data-page="decisions"`):button('Start run','pipeline-run','primary',`data-id="${p.id}"`)}</div>
          </div></div>`:'<div class="empty">No workflows for this project.</div>'}</div>`;
    };
    function documentCard(a){return `<button class="doc-card" data-act="artifact" data-id="${a.id}"><div class="doc-page"><div class="doc-kicker">${e(a.type)} · ${e(projectNames[a.project])}</div><div class="doc-heading">${e(a.title.replace(/\.[^.]+$/,''))}</div><div class="doc-rule"></div><div class="doc-line" style="width:86%"></div><div class="doc-line" style="width:73%"></div><div class="doc-line" style="width:91%"></div><div class="doc-line" style="width:58%"></div></div><div class="doc-title">${e(a.title)}</div><div class="doc-meta">${e(a.agent)} · ${e(a.time)}</div></button>`}
    artifactsView=function(){let rows=artifacts.filter(a=>byProject(a)&&(state.artifactType==='All'||a.type===state.artifactType));return `<div class="page">${header('Artifacts')}<div class="tool-row" style="margin-bottom:16px"><div class="field"><label for="artifact-kind">Format</label><select id="artifact-kind">${['All','HTML','PDF','Markdown'].map(v=>`<option ${state.artifactType===v?'selected':''}>${v}</option>`).join('')}</select></div></div>${rows.length?`<div class="doc-grid">${rows.map(documentCard).join('')}</div>`:'<div class="empty">No documents match this filter.</div>'}</div>`};
    function optionList(id,label,values,selected){return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${values.map(([value,text])=>`<option value="${e(value)}" ${value===selected?'selected':''}>${e(text)}</option>`).join('')}</select></div>`}
    function teamForm(team){
      const editing=!!team,lead=team?.lead||agents[0]?.id;
      const body=`<div class="drawer-section"><h3>Team</h3>${field('team-name','Name',team?.name||'')}${optionList('team-project','Project',Object.entries(projectNames),team?.project||'ion')}<div class="field"><label for="team-instructions">Shared instructions</label><textarea id="team-instructions">${e(team?.instructions||'')}</textarea></div></div>
        <div class="drawer-section"><h3>Reporting structure</h3>${optionList('team-lead','Team lead',agents.map(a=>[a.id,a.name]),lead)}${agents.map(a=>`<div class="connect-row"><label class="checkline grow"><input type="checkbox" name="team-members" value="${a.id}" ${team?.members.includes(a.id)||(!editing&&a.id===lead)?'checked':''}>${e(a.name)} <span class="faint">· ${e(a.role)}</span></label>${a.id!==lead?`<select class="report-select" data-manager-for="${a.id}" aria-label="${e(a.name)} reports to">${agents.filter(other=>other.id!==a.id).map(other=>`<option value="${other.id}" ${team?.reportsTo?.[a.id]===other.id||!team&&other.id===lead?'selected':''}>${e(other.name)}</option>`).join('')}</select>`:''}</div>`).join('')}</div>
        <div class="drawer-section"><h3>Limits</h3>${field('team-budget','Team token cap',team?.budget||'40,000 tokens')}</div>`;
      return drawer(editing?'Edit hierarchy':'New team',body,`${button('Cancel','close','quiet')}${button(editing?'Save hierarchy':'Create team','team-save','primary')}`);
    }
    function belowAgent(team,id){const found=[];const walk=parent=>{for(const child of teamChildren(team,parent)){if(!found.includes(child)){found.push(child);walk(child)}}};walk(id);return found}
    renderDrawer=function(){
      const d=state.drawer;if(!d)return '';
      if(d==='agent-new')return drawer('New agent',`<div class="drawer-section"><h3>Profile</h3>${field('agent-name','Name')}${field('agent-purpose','Expertise')}<div class="field"><label for="agent-instructions">Instructions</label><textarea id="agent-instructions" placeholder="What this agent is responsible for and what it should return"></textarea></div></div>
        <div class="drawer-section"><h3>Execution</h3>${optionList('agent-harness','Harness',harnesses.map(h=>[h.id,h.name]),'nebius')}<p>Choose from ion's supported harnesses. Availability and account setup are checked by the live app.</p><div class="form-grid">${field('agent-model','Model override','','text','placeholder="Provider default or model ID"')}${optionList('agent-host','Host',[['Desktop','Desktop'],['Personal cloud','Personal cloud']],'Desktop')}${field('agent-budget','Per-run token cap','10,000','number')}</div></div>
        <div class="drawer-section"><h3>Access</h3>${field('agent-paths','Workspace paths','Project workspace')}<label class="checkline"><input id="grant-read" type="checkbox" checked>Read project files</label><label class="checkline"><input id="grant-write" type="checkbox">Edit approved paths</label><label class="checkline"><input id="grant-web" type="checkbox">Web search</label><label class="checkline"><input id="grant-github" type="checkbox">GitHub connected app</label><p>Changes outside these grants require a decision.</p></div>`,`${button('Cancel','close','quiet')}${button('Save draft agent','agent-save','primary')}`);
      if(d==='team-new')return teamForm(null);
      if(d.startsWith('team-edit:'))return teamForm(teams.find(t=>t.id===d.slice(10)));
      if(d.startsWith('agent:')){
        const a=agents.find(x=>x.id===d.slice(6)),team=teams.find(t=>t.id===state.team&&t.members.includes(a.id))||teams.find(t=>t.members.includes(a.id));if(!a)return '';
        const manager=agents.find(x=>x.id===team?.reportsTo?.[a.id]),below=team?belowAgent(team,a.id):[];
        return drawer(a.name,`<div class="drawer-section"><div style="display:flex;gap:11px;align-items:center">${avatar(a.name,a.tone)}<div><strong>${e(a.role)}</strong><div class="tiny faint">${e(a.status)}</div></div></div></div>
          <div class="drawer-section"><h3>Team position</h3><div class="kv"><span>Team</span><span>${e(team?.name||'Unassigned')}</span></div><div class="kv"><span>Reports to</span><span>${e(manager?.name||'Team lead')}</span></div><div class="kv"><span>Can delegate to</span><span>${below.map(id=>e(agents.find(x=>x.id===id)?.name||'')).join(', ')||'No agents below'}</span></div></div>
          <div class="drawer-section"><h3>Instructions</h3><p>${e(a.instructions||a.role+' for ion tasks. Return work with evidence and send approval decisions to the user.')}</p></div>
          <div class="drawer-section"><h3>Execution & access</h3><div class="kv"><span>Harness</span><span>${e(harnesses.find(h=>h.id===a.harness)?.name||'Nebius Nemotron')}</span></div><div class="kv"><span>Model</span><span>${e(a.model||'Provider default')}</span></div><div class="kv"><span>Host</span><span>${e(a.host)}</span></div><div class="effect">${e(a.access)}${a.paths?'\nPaths: '+e(a.paths):''}</div></div>`,below.length?`${button('Delegate task','delegate-open','primary',`data-id="${a.id}"`)}`:'');
      }
      if(d.startsWith('delegate:')){
        const from=agents.find(a=>a.id===d.slice(9)),team=teams.find(t=>t.id===state.team&&t.members.includes(from.id))||teams.find(t=>t.members.includes(from.id));
        const choices=belowAgent(team,from.id).map(id=>[id,agents.find(a=>a.id===id)?.name||id]);
        return drawer('Delegate task',`<div class="drawer-section"><div class="kv"><span>From</span><span>${e(from.name)}</span></div><div class="kv"><span>Team</span><span>${e(team.name)}</span></div></div><div class="drawer-section">${field('delegate-title','Task')}<div class="field"><label for="delegate-instructions">Instructions</label><textarea id="delegate-instructions" placeholder="Outcome and acceptance criteria"></textarea></div>${optionList('delegate-assignee','Assign to',choices,choices[0]?.[0])}</div>`,`${button('Cancel','close','quiet')}${button('Delegate','delegate-save','primary',`data-id="${from.id}"`)}`);
      }
      if(d==='pipeline-new')return drawer('New workflow',`<div class="drawer-section"><h3>Describe the workflow</h3>${field('workflow-title','Name')}<div class="field"><label for="workflow-prompt">Prompt</label><textarea id="workflow-prompt" style="min-height:135px" placeholder="Describe the outcome, steps, checks, and approvals"></textarea></div>${optionList('workflow-project','Project',Object.entries(projectNames),state.project==='all'?'ion':state.project)}</div><div class="drawer-section"><h3>Apps and resources</h3><div class="connect-row"><div class="grow"><strong>Local workspace</strong><small>Project files and checks</small></div>${tag('Available','good')}</div>${Object.entries(connectedApps).map(([name,connected])=>`<div class="connect-row"><label class="checkline grow"><input type="checkbox" name="workflow-app" value="${e(name)}" ${connected&&name==='GitHub'?'checked':''} ${connected?'':'disabled'}><span>${e(name)}<small>${connected?'Connected':'Connection required'}</small></span></label>${connected?tag('Connected','good'):`${button('Connect','app-connect','small',`data-id="${e(name)}"`)}`}</div>`).join('')}</div>`,`${button('Cancel','close','quiet')}${button('Generate draft','workflow-generate','primary')}`);
      if(d.startsWith('workflow-stage:')){
        const [,workflowId,indexText]=d.split(':'),p=pipelines.find(x=>x.id===workflowId),index=Number(indexText),stage=p?.stages[index];if(!stage)return '';
        const apps=['Local workspace','ion',...Object.entries(connectedApps).filter(([,yes])=>yes).map(([name])=>name)];
        return drawer(`Stage ${index+1}`,`<div class="drawer-section">${field('stage-title','Stage name',stage.title)}${optionList('stage-kind','Type',[['Agent task','Agent task'],['Validation','Validation'],['Human approval','Human approval'],['App action','App action']],stage.kind)}${optionList('stage-owner','Responsible',[['Lead','Lead'],['Researcher','Researcher'],['Engineer','Engineer'],['Reviewer','Reviewer'],['You','You']],stage.owner)}${optionList('stage-app','App or resource',apps.map(a=>[a,a]),stage.app)}<label class="checkline"><input id="stage-approval" type="checkbox" ${stage.approval?'checked':''}>Require user approval</label></div>`,`${button('Delete','workflow-stage-delete','danger',`data-id="${workflowId}" data-index="${index}"`)}${button('Move up','workflow-stage-move','small',`data-id="${workflowId}" data-index="${index}" data-dir="-1"`)}${button('Move down','workflow-stage-move','small',`data-id="${workflowId}" data-index="${index}" data-dir="1"`)}${button('Save stage','workflow-stage-save','primary',`data-id="${workflowId}" data-index="${index}"`)}`);
      }
      if(d.startsWith('artifact:')){
        const a=artifacts.find(x=>x.id===d.slice(9));if(!a)return '';
        return drawer(a.title,`<div class="drawer-section"><div class="tool-row">${tag(a.type,'blue')}${tag(e(projectNames[a.project]))}<span class="faint tiny">${e(a.time)}</span></div><div class="kv"><span>Produced by</span><span>${e(a.agent)}</span></div><div class="kv"><span>Source task</span><span>${e(tasks.find(t=>t.id===a.task)?.title||'')}</span></div><div class="kv"><span>Storage</span><span>${e(a.storage)}</span></div></div><div class="document-preview"><div class="eyebrow">${e(projectNames[a.project])} · ${e(a.type)}</div><h2>${e(a.title.replace(/\.[^.]+$/,''))}</h2><hr><p>${e(a.preview)}</p></div>`,`${button('Open task','task','',`data-id="${a.task}"`)}`);
      }
      return baseDrawer();
    };
    const baseTaskView=taskView;
    taskView=function(){
      const t=tasks.find(x=>x.id===state.task);if(!t?.delegatedFrom)return baseTaskView();
      const from=agents.find(a=>a.id===t.delegatedFrom),to=agents.find(a=>a.id===t.assignedTo),team=teams.find(x=>x.id===t.team);
      return `<div class="task-layout"><div class="transcript"><div class="transcript-scroll"><div class="transcript-inner"><div class="message"><div class="who">${e(from?.name||'Lead')} → ${e(to?.name||'Agent')}</div><p>${e(t.title)}</p><div class="effect">${e(t.prompt||'')}</div></div>${state.taskMessages.map(m=>`<div class="message user"><div class="who">You</div><p>${e(m)}</p></div>`).join('')}</div></div><div class="composer-wrap"><div class="composer"><textarea id="composer" placeholder="Message the team…" aria-label="Message the team"></textarea><div class="composer-foot">${e(team?.name||'Team')} · ${e(to?.name||'Agent')}<span class="push"></span><button class="iconbtn" data-act="send" aria-label="Send message">${icon('arrow-up')}</button></div></div></div></div><aside class="task-rail"><h2>Delegation</h2><div class="kv"><span>From</span><span>${e(from?.name||'')}</span></div><div class="kv"><span>Assigned to</span><span>${e(to?.name||'')}</span></div><div class="kv"><span>Team</span><span>${e(team?.name||'')}</span></div></aside></div>`;
    };
    function hierarchyIsValid(members,lead,reports){
      for(const id of members){if(id===lead)continue;const seen=new Set([id]);let current=id;while(current!==lead){current=reports[current];if(!current||!members.includes(current)||seen.has(current))return false;seen.add(current)}}return true;
    }
    act=function(action,el){
      const id=el.dataset.id;
      switch(action){
        case 'agent-save':{
          const name=val('agent-name'),harness=val('agent-harness');if(!name){toast('Enter an agent name');return}
          if(!harnesses.some(h=>h.id===harness)){toast('Choose a supported harness');return}
          agents.push({id:'agent-'+Date.now(),name,role:val('agent-purpose')||'Agent',status:'Draft',tone:'blue',task:'No task',harness,model:val('agent-model')||'Provider default',host:val('agent-host'),instructions:val('agent-instructions'),paths:val('agent-paths'),access:[document.getElementById('grant-read')?.checked?'Read workspace':'',document.getElementById('grant-write')?.checked?'Edit approved paths':'',document.getElementById('grant-web')?.checked?'Web search':'',document.getElementById('grant-github')?.checked?'GitHub':''].filter(Boolean).join(' · ')||'No access'});
          state.drawer=null;navigate('teams');toast('Agent draft saved');return;
        }
        case 'workspace':navigate('dashboard');return;
        case 'team-view':state.teamView=id;render();return;
        case 'team-edit':state.drawer='team-edit:'+id;render();return;
        case 'team-save':{
          const name=val('team-name'),lead=val('team-lead');if(!name){toast('Enter a team name');return}
          const members=[...document.querySelectorAll('input[name="team-members"]:checked')].map(input=>input.value);if(!members.includes(lead))members.unshift(lead);
          const reports={};for(const member of members){if(member!==lead)reports[member]=document.querySelector(`[data-manager-for="${member}"]`)?.value||lead}
          if(!hierarchyIsValid(members,lead,reports)){toast('Each agent must report up to the team lead');return}
          const editing=state.drawer?.startsWith('team-edit:'),existing=editing?teams.find(t=>t.id===state.drawer.slice(10)):null;
          const updated={id:existing?.id||'team-'+Date.now(),name,project:val('team-project'),lead,members,reportsTo:reports,instructions:val('team-instructions'),budget:val('team-budget')||'40,000 tokens',status:'Available'};
          if(existing)Object.assign(existing,updated);else teams.push(updated);
          state.team=updated.id;state.project='all';navigate('teams');toast(editing?'Hierarchy saved':'Team created');return;
        }
        case 'delegate-open':state.drawer='delegate:'+id;render();return;
        case 'delegate-save':{
          const title=val('delegate-title'),assignedTo=val('delegate-assignee'),from=id,team=teams.find(t=>t.id===state.team&&t.members.includes(from))||teams.find(t=>t.members.includes(from));
          if(!title){toast('Enter a task');return}if(!team||!belowAgent(team,from).includes(assignedTo)){toast('Choose an agent below the delegator');return}
          const task={id:'delegated-'+Date.now(),title,prompt:val('delegate-instructions'),project:team.project,status:'Queued',team:team.id,delegatedFrom:from,assignedTo,updated:'Now'};
          tasks.unshift(task);state.task=task.id;navigate('task');toast('Task delegated');return;
        }
        case 'app-connect':{
          connectedApps[id]=true;const row=el.closest('.connect-row'),check=row?.querySelector('input[name="workflow-app"]');if(check){check.disabled=false;check.checked=true;row.querySelector('small').textContent='Connected'}el.outerHTML=tag('Connected','good');return;
        }
        case 'workflow-generate':{
          const title=val('workflow-title'),prompt=val('workflow-prompt'),project=val('workflow-project');if(!title||!prompt){toast('Enter a name and workflow prompt');return}
          const apps=[...document.querySelectorAll('input[name="workflow-app"]:checked')].map(input=>input.value).filter(name=>connectedApps[name]);
          const stages=workflowStagesFromPrompt(prompt,apps);if(!stages.length){toast('Describe at least one step');return}
          const workflow={id:'workflow-'+Date.now(),title,project,version:'v1',status:'Draft',last:'Not run',prompt,apps,stages,current:0};pipelines.unshift(workflow);state.pipeline=workflow.id;state.project='all';navigate('pipelines');toast('Workflow draft generated');return;
        }
        case 'workflow-stage':state.drawer=`workflow-stage:${id}:${el.dataset.index}`;render();return;
        case 'workflow-add-stage':{
          const p=pipelines.find(x=>x.id===id);p.stages.push({title:'New stage',kind:'Agent task',owner:'Lead',app:'Local workspace',approval:false});state.drawer=`workflow-stage:${id}:${p.stages.length-1}`;render();return;
        }
        case 'workflow-stage-save':{
          const p=pipelines.find(x=>x.id===id),stage=p?.stages[Number(el.dataset.index)];if(!stage)return;
          const title=val('stage-title');if(!title){toast('Enter a stage name');return}
          Object.assign(stage,{title,kind:val('stage-kind'),owner:val('stage-owner'),app:val('stage-app'),approval:!!document.getElementById('stage-approval')?.checked});
          if(p.status!=='Draft')p.version='v'+(Number(p.version.slice(1))+1);state.drawer=null;render();toast('Stage saved');return;
        }
        case 'workflow-stage-delete':{
          const p=pipelines.find(x=>x.id===id);if(p.stages.length===1){toast('A workflow needs at least one stage');return}
          p.stages.splice(Number(el.dataset.index),1);p.current=Math.min(p.current,p.stages.length-1);state.drawer=null;render();toast('Stage removed');return;
        }
        case 'workflow-stage-move':{
          const p=pipelines.find(x=>x.id===id),from=Number(el.dataset.index),to=from+Number(el.dataset.dir);
          if(to<0||to>=p.stages.length)return;
          [p.stages[from],p.stages[to]]=[p.stages[to],p.stages[from]];
          state.drawer=`workflow-stage:${id}:${to}`;render();toast('Stage moved');return;
        }
        default:return baseAct(action,el);
      }
    };
    render();
  </script>
</body>
</html>
