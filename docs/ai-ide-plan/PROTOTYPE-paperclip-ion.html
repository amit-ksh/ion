    .full-page{padding:27px 32px 110px;max-width:1280px;margin:auto}.overview-grid{display:grid;grid-template-columns:1.25fr .8fr;gap:13px;margin-top:20px}.overview-decision{padding:20px}.overview-task{padding:17px}.overview-list{margin-top:20px}.list-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--soft)}.list-row:last-child{border-bottom:0}.decision-list{max-width:1050px}.decision-row{display:grid;grid-template-columns:29px minmax(0,1fr) auto;gap:11px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}.decision-row .avatar{width:27px;height:27px}.empty-state{padding:60px 22px;text-align:center;color:var(--muted)}.empty-state strong{color:var(--text);display:block;font-size:16px;margin-bottom:5px}.footer-strip{height:31px;flex:none;border-top:1px solid var(--line);padding:0 18px;display:flex;align-items:center;gap:15px;color:var(--faint);font-size:10px;background:var(--bg)}.footer-strip .right{margin-left:auto}.switcher{position:fixed;z-index:30;left:50%;bottom:17px;transform:translateX(-50%);display:flex;align-items:center;gap:3px;padding:5px;background:#f3f3f3;color:#242424;border:1px solid rgba(0,0,0,.2);box-shadow:0 10px 38px rgba(0,0,0,.37);border-radius:11px;font-size:11px}.switcher button{border:0;background:transparent;color:#222;min-width:28px;height:28px;border-radius:6px}.switcher button:hover,.switcher button.selected{background:#dce0e0}.switcher .label{font-size:11px;font-weight:720;padding:0 9px;min-width:155px;text-align:center}.switcher .hint{padding:0 10px;border-left:1px solid #c8cbcb;color:#616565}.toast{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);background:var(--raised);color:var(--text);border:1px solid var(--line);padding:9px 13px;border-radius:8px;box-shadow:var(--shadow);z-index:35;font-size:12px}

<body>
  <div class="prototype-ribbon"><b>PROTOTYPE</b><span>· synthetic data · choices here do not run agents or change files</span></div>
  <div id="app"></div>
  <div id="switcher"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script>
    const variants=[['focus','Conversation first'],['board','Work board'],['desk','Decision first']];
    const params=new URLSearchParams(location.search);
    let variant=variants.some(v=>v[0]===params.get('variant'))?params.get('variant'):'focus';
    let state={phase:'plan',page:'task',paused:false,revised:false,selected:'offline',theme:'dark',decision:'plan',turn:0};
    const steps=[
      {id:'inspect',title:'Inspect mobile cache and reconnect path',role:'Researcher',avatar:'R',tone:'sage',scope:'Read mobile task cache and daemon reconnect code',evidence:'Code references and failure map'},
      {id:'offline',title:'Implement explicit offline task state',role:'Engineer',avatar:'E',tone:'blue',scope:'apps/mobile/src/lib and task feed',evidence:'Patch and local checks'},
      {id:'review',title:'Review accessibility and recovery',role:'Reviewer',avatar:'V',tone:'gray',scope:'Read changed files and task events',evidence:'Review report with risks'},
      {id:'verify',title:'Run targeted verification',role:'Lead',avatar:'L',tone:'',scope:'Affected mobile checks',evidence:'Command result and summary'}
    ];
    const phaseName={plan:'Plan needs review',running:'Team working',decision:'Decision needed',blocked:'Blocked by decision',review:'Ready for review',done:'Completed'};
    const phaseTone={plan:'hot',running:'good',decision:'warn',blocked:'bad',review:'hot',done:'good'};
    const decisionCount=()=>['plan','decision','blocked','review'].includes(state.phase)?1:0;
    const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function stepStatus(id){let p=state.phase;if(p==='plan')return 'queued';if(id==='inspect')return 'done';if(id==='offline')return p==='running'?'active':p==='blocked'?'blocked':'done';if(id==='review')return ['review','done'].includes(p)?'done':'queued';if(id==='verify')return p==='done'?'done':p==='review'?'active':'queued';return 'queued'}
    function stepIcon(status){return `<span class="step-icon ${status==='done'?'done':status==='active'?'active':''}">${status==='done'?'✓':status==='active'?'●':status==='blocked'?'!':'·'}</span>`}
    function avatar(letter,tone=''){return `<span class="avatar ${tone}">${letter}</span>`}
    function chip(label,tone='flat'){return `<span class="chip ${tone}">${label}</span>`}
    function button(label,action,kind='',extra=''){return `<button class="button ${kind}" data-action="${action}" ${extra}>${label}</button>`}
    function microHeader(label,text){return `<div class="between"><span class="caps">${label}</span><span class="micro muted">${text}</span></div>`}
    function workRow(step){let st=stepStatus(step.id);return `<div class="work-row">${stepIcon(st)}<button class="row-button" data-action="select" data-id="${step.id}"><span class="step-name">${step.title}</span><div class="step-meta">${step.role} · ${st==='done'?'Evidence ready':st==='active'?'Working on desktop':st==='blocked'?'Waiting for your decision':'Waiting for dependency'}</div></button><span class="micro muted">${st}</span></div>`}
    function progress(){let p=state.phase;return p==='plan'?0:p==='running'?28:p==='decision'||p==='blocked'?52:p==='review'?78:100}

    function rememberVariant(){try{let url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url)}catch{}}
    function setVariant(delta){let index=variants.findIndex(v=>v[0]===variant);variant=variants[(index+delta+variants.length)%variants.length][0];rememberVariant();render()}
    function act(name,el){switch(name){case 'prev':setVariant(-1);return;case 'next':setVariant(1);return;case 'reset':state={phase:'plan',page:'task',paused:false,revised:false,selected:'offline',theme:state.theme,decision:'plan',turn:0};toast('Demo reset to plan review');break;case 'theme':state.theme=state.theme==='dark'?'light':'dark';break;case 'page':state.page=el.dataset.page;break;case 'open-step':state.selected=el.dataset.id;state.page='task';break;case 'select':state.selected=el.dataset.id;toast('Work item selected');break;case 'approve-plan':state.phase='running';state.page='task';toast('Plan V'+(state.revised?'2':'1')+' approved · team started');break;case 'revise':state.revised=true;toast('Lead revised the plan: file scope reduced, roles unchanged');break;case 'team':state.page='task';state.selected='inspect';toast('Team grants are shown in the work-item details');break;case 'advance':state.phase='decision';toast('Engineer finished · exact patch needs your approval');break;case 'diff':state.page='diff';break;case 'back-task':state.page='task';break;case 'approve-patch':state.phase='review';state.page='task';toast('Exact patch approved · verifier finished');break;case 'deny':state.phase='blocked';state.page='task';toast('Patch denied · no automatic retry');break;case 'revise-patch':state.phase='decision';state.revised=true;toast('Revised patch proposed for review');break;case 'accept':state.phase='done';state.page='task';toast('Deliverable accepted · task complete');break;case 'followup':state.phase='running';state.revised=true;state.page='task';toast('Follow-up requested · plan V2 recorded');break;case 'pause':state.paused=!state.paused;toast(state.paused?'Task paused':'Task resumed');break;case 'send':let input=document.getElementById('composer');if(input&&input.value.trim()){toast('Prototype only: your message was not sent');input.value=''}else toast('Write a message to steer the task');return;case 'goto-focus':variant='focus';state.page='task';rememberVariant();break;case 'goto-desk':variant='desk';state.page='task';rememberVariant();break;case 'new':toast('New task setup is described in the implementation plan');return;case 'search':toast('Search is part of the existing ion shell');return;case 'toast':toast(el.dataset.message||'Sample context only');return;}render()}
    document.addEventListener('click',event=>{let el=event.target.closest('[data-action]');if(el)act(el.dataset.action,el)});
    document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,[contenteditable]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();setVariant(event.key==='ArrowRight'?1:-1)}});
    render();
  </script>
</body>
