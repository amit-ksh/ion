<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aLime" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8fd12a"/>
    </marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7f75"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f6f8f4"/>

  <text x="30" y="52" font-size="28" font-weight="700" fill="#14211b">ion architecture</text>
  <text x="30" y="80" font-size="16" fill="#5b6e64">NVIDIA Nemotron on Nebius Token Factory does the thinking; your own Token Factory sandbox does the running; the local daemon decides what is allowed.</text>

  <!-- Column labels -->
  <text x="30" y="118" font-size="12" font-weight="600" letter-spacing="2" fill="#5b6e64">YOU</text>
  <text x="400" y="118" font-size="12" font-weight="600" letter-spacing="2" fill="#5b6e64">YOUR MACHINE</text>
  <text x="930" y="118" font-size="12" font-weight="700" letter-spacing="2" fill="#3a6309">NEBIUS CLOUD · YOUR TOKEN FACTORY PROJECT</text>

  <!-- ===== YOU ===== -->
  <rect x="30" y="130" width="300" height="236" rx="16" fill="#ffffff" stroke="#d5ddd0" stroke-width="2"/>
  <text x="52" y="166" font-size="21" font-weight="700" fill="#14211b">ion desktop</text>
  <text x="52" y="189" font-size="14" fill="#5b6e64">Native Rust UI (GPUI)</text>
  <g font-size="14" fill="#2a3a32">
    <rect x="48" y="204" width="264" height="30" rx="7" fill="#eef2ea"/><text x="62" y="224">Tasks, projects, decisions</text>
    <rect x="48" y="240" width="264" height="30" rx="7" fill="#eef2ea"/><text x="62" y="260">Agent teams and org chart</text>
    <rect x="48" y="276" width="264" height="30" rx="7" fill="#eef2ea"/><text x="62" y="296">Workflows and routines</text>
    <rect x="48" y="312" width="264" height="30" rx="7" fill="#eef2ea"/><text x="62" y="332">Artifacts and deploys</text>
  </g>

  <rect x="30" y="398" width="300" height="112" rx="16" fill="#ffffff" stroke="#d5ddd0" stroke-width="2"/>
  <text x="52" y="434" font-size="21" font-weight="700" fill="#14211b">ion for Android</text>
  <text x="52" y="458" font-size="14" fill="#5b6e64">Expo / React Native</text>
  <text x="52" y="480" font-size="14" fill="#5b6e64">Start, watch and steer tasks,</text>
  <text x="52" y="498" font-size="14" fill="#5b6e64">answer approvals on the go</text>

  <rect x="30" y="548" width="300" height="132" rx="16" fill="#f1f4ee" stroke="#a5b4a0" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="52" y="584" font-size="19" font-weight="700" fill="#2a3a32">Personal gateway</text>
  <text x="52" y="608" font-size="14" fill="#5b6e64">Optional, owner hosted</text>
  <text x="52" y="630" font-size="14" fill="#5b6e64">Scoped phone to desktop pairing</text>
  <text x="52" y="652" font-size="14" fill="#5b6e64">Streaming speech: Nemotron ASR</text>
  <text x="52" y="670" font-size="12" fill="#7d8c84">nemotron-3.5-asr-streaming-0.6b</text>

  <!-- ===== YOUR MACHINE ===== -->
  <rect x="400" y="130" width="420" height="550" rx="16" fill="#ffffff" stroke="#b9c6b3" stroke-width="2"/>
  <text x="422" y="166" font-size="21" font-weight="700" fill="#14211b">ion local daemon</text>
  <text x="422" y="189" font-size="14" fill="#5b6e64">Owns the workspace, the tools, the keys and every approval</text>
  <g font-size="14" fill="#2a3a32">
    <rect x="418" y="204" width="384" height="48" rx="8" fill="#eef2ea"/>
    <text x="432" y="224" font-weight="600">Nebius agent runtime</text>
    <text x="432" y="243" font-size="12.5" fill="#5b6e64">Solo agents and teams, with call, token and time budgets</text>

    <rect x="418" y="260" width="384" height="48" rx="8" fill="#eef2ea"/>
    <text x="432" y="280" font-weight="600">Agent tools</text>
    <text x="432" y="299" font-size="12.5" fill="#5b6e64">read_file, write_file, list_files, Git diff, tokenfactory_exec</text>

    <rect x="418" y="316" width="384" height="48" rx="8" fill="#f0fadb" stroke="#8fd12a" stroke-width="1.8"/>
    <text x="432" y="336" font-weight="700" fill="#1f3a08">Approval gate</text>
    <text x="432" y="355" font-size="12.5" fill="#3a6309">Shows exact edits, commands and app actions before they run</text>

    <rect x="418" y="372" width="384" height="48" rx="8" fill="#eef2ea"/>
    <text x="432" y="392" font-weight="600">Isolated Git workspace per team run</text>
    <text x="432" y="411" font-size="12.5" fill="#5b6e64">Reviewable results, nothing merged without you</text>

    <rect x="418" y="428" width="384" height="48" rx="8" fill="#eef2ea"/>
    <text x="432" y="448" font-weight="600">Workflow and routine scheduler</text>
    <text x="432" y="467" font-size="12.5" fill="#5b6e64">Chains teams, runs work on a schedule</text>

    <rect x="418" y="484" width="384" height="48" rx="8" fill="#eef2ea"/>
    <text x="432" y="504" font-weight="600">OS credential vault</text>
    <text x="432" y="523" font-size="12.5" fill="#5b6e64">Nebius key stays on device, never baked into an image</text>

    <rect x="418" y="540" width="384" height="48" rx="8" fill="#eef2ea"/>
    <text x="432" y="560" font-weight="600">Task state and usage receipts</text>
    <text x="432" y="579" font-size="12.5" fill="#5b6e64">SQLite transcripts, a receipt for every model call</text>

    <rect x="418" y="596" width="384" height="48" rx="8" fill="#eef2ea"/>
    <text x="432" y="616" font-weight="600">Local dictation</text>
    <text x="432" y="635" font-size="12.5" fill="#5b6e64">NVIDIA Parakeet TDT-CTC 110M, on device</text>
  </g>

  <!-- ===== NEBIUS ===== -->
  <g filter="url(#glow)">
    <rect x="930" y="130" width="640" height="550" rx="18" fill="#f0fadb" stroke="#b8f24c" stroke-width="4"/>
  </g>
  <text x="954" y="172" font-size="27" font-weight="800" fill="#3a6309">Nebius Token Factory</text>
  <rect x="1262" y="151" width="112" height="26" rx="13" fill="#b8f24c"/>
  <text x="1318" y="169" font-size="12" font-weight="800" letter-spacing="1" text-anchor="middle" fill="#1f3a08">ONE API KEY</text>

  <!-- Inference API -->
  <rect x="954" y="192" width="566" height="214" rx="14" fill="#ffffff" stroke="#c9e58f" stroke-width="2"/>
  <text x="974" y="222" font-size="17" font-weight="700" fill="#1f3a08">Inference API</text>
  <text x="1100" y="222" font-size="13" fill="#55761f">OpenAI-compatible /v1 · streaming, reasoning, tool calls</text>
  <g>
    <rect x="972" y="236" width="530" height="50" rx="9" fill="#f7fcec" stroke="#b8f24c" stroke-width="2"/>
    <text x="988" y="257" font-size="16" font-weight="700" fill="#1f3a08">NVIDIA Nemotron 3 Super 120B-A12B</text>
    <text x="988" y="277" font-size="12.5" fill="#55761f">Default for agents and teams · mixture of experts, about 12B active</text>
    <rect x="972" y="294" width="530" height="50" rx="9" fill="#f7fcec" stroke="#b8f24c" stroke-width="2"/>
    <text x="988" y="315" font-size="16" font-weight="700" fill="#1f3a08">NVIDIA Nemotron 3.5 Lightning</text>
    <text x="988" y="335" font-size="12.5" fill="#55761f">Fast, interactive solo tasks</text>
    <rect x="972" y="352" width="530" height="40" rx="9" fill="#ffffff" stroke="#d9ecb3" stroke-width="1.5"/>
    <text x="988" y="377" font-size="14" fill="#3a6309">DeepSeek and other open models · 29 on the tested key</text>
  </g>

  <!-- Sandboxes API -->
  <rect x="954" y="428" width="566" height="236" rx="14" fill="#ffffff" stroke="#c9e58f" stroke-width="2"/>
  <text x="974" y="458" font-size="17" font-weight="700" fill="#1f3a08">Sandboxes API</text>
  <text x="1110" y="458" font-size="13" fill="#55761f">/sandboxes/v1 · fresh Linux VMs, never your laptop</text>
  <g>
    <rect x="972" y="472" width="530" height="54" rx="9" fill="#f7fcec" stroke="#d9ecb3" stroke-width="1.5"/>
    <text x="988" y="494" font-size="15" font-weight="700" fill="#1f3a08">Private image  ion-sandbox:&lt;digest&gt;</text>
    <text x="988" y="514" font-size="12.5" fill="#55761f">Built once in your project: Python 3.12 + ion-harness-worker, no secrets inside</text>
    <rect x="972" y="534" width="530" height="54" rx="9" fill="#f7fcec" stroke="#d9ecb3" stroke-width="1.5"/>
    <text x="988" y="556" font-size="15" font-weight="700" fill="#1f3a08">Command sandbox</text>
    <text x="988" y="576" font-size="12.5" fill="#55761f">Approved exact argv, disposable, networking off, 120 s limit</text>
    <rect x="972" y="596" width="530" height="54" rx="9" fill="#f7fcec" stroke="#d9ecb3" stroke-width="1.5"/>
    <text x="988" y="618" font-size="15" font-weight="700" fill="#1f3a08">Sandbox team agent</text>
    <text x="988" y="638" font-size="12.5" fill="#55761f">Model worker runs here, key mounted read-only for that run</text>
  </g>

  <!-- Sandbox agent -> inference (inside Nebius) -->
  <path d="M1504,623 H1545 V264 H1506" fill="none" stroke="#8fd12a" stroke-width="4" stroke-dasharray="9 6" marker-end="url(#aLime)"/>
  <text x="1556" y="450" font-size="12" font-weight="600" fill="#3a6309" transform="rotate(90 1556 450)" text-anchor="middle">model calls</text>

  <!-- ===== Arrows ===== -->
  <!-- desktop <-> daemon -->
  <line x1="332" y1="250" x2="398" y2="250" stroke="#6b7f75" stroke-width="3" marker-start="url(#aGray)" marker-end="url(#aGray)"/>
  <!-- phone <-> gateway -->
  <line x1="180" y1="512" x2="180" y2="546" stroke="#6b7f75" stroke-width="2.5" stroke-dasharray="6 5" marker-start="url(#aGray)" marker-end="url(#aGray)"/>
  <!-- gateway <-> daemon -->
  <line x1="332" y1="614" x2="398" y2="614" stroke="#6b7f75" stroke-width="2.5" stroke-dasharray="6 5" marker-start="url(#aGray)" marker-end="url(#aGray)"/>

  <!-- daemon <-> inference -->
  <line x1="822" y1="290" x2="928" y2="290" stroke="#8fd12a" stroke-width="6" marker-start="url(#aLime)" marker-end="url(#aLime)"/>
  <text x="875" y="256" font-size="12.5" font-weight="700" text-anchor="middle" fill="#3a6309">prompts,</text>
  <text x="875" y="272" font-size="12.5" font-weight="700" text-anchor="middle" fill="#3a6309">tool calls</text>
  <!-- daemon <-> sandboxes -->
  <line x1="822" y1="555" x2="928" y2="555" stroke="#8fd12a" stroke-width="6" marker-start="url(#aLime)" marker-end="url(#aLime)"/>
  <text x="875" y="505" font-size="12.5" font-weight="700" text-anchor="middle" fill="#3a6309">approved</text>
  <text x="875" y="521" font-size="12.5" font-weight="700" text-anchor="middle" fill="#3a6309">commands,</text>
  <text x="875" y="537" font-size="12.5" font-weight="700" text-anchor="middle" fill="#3a6309">team runs</text>
  <text x="875" y="580" font-size="12" text-anchor="middle" fill="#55761f">results back</text>

  <!-- ===== Optional integrations ===== -->
  <rect x="930" y="716" width="310" height="92" rx="14" fill="#f1f4ee" stroke="#d5ddd0" stroke-width="2"/>
  <text x="952" y="748" font-size="17" font-weight="700" fill="#2a3a32">Other harnesses</text>
  <text x="952" y="772" font-size="13.5" fill="#5b6e64">Codex, OpenCode, Pi and more,</text>
  <text x="952" y="792" font-size="13.5" fill="#5b6e64">each with its own sign-in. Optional.</text>

  <rect x="1260" y="716" width="310" height="92" rx="14" fill="#f1f4ee" stroke="#d5ddd0" stroke-width="2"/>
  <text x="1282" y="748" font-size="17" font-weight="700" fill="#2a3a32">Composio connected apps</text>
  <text x="1282" y="772" font-size="13.5" fill="#5b6e64">Gmail, Slack and more, each action</text>
  <text x="1282" y="792" font-size="13.5" fill="#5b6e64">exactly approved, with a receipt.</text>

  <path d="M610,682 V762 H928" fill="none" stroke="#6b7f75" stroke-width="2.5" marker-start="url(#aGray)" marker-end="url(#aGray)"/>
  <path d="M1245,830 H1415 V810" fill="none" stroke="#6b7f75" stroke-width="2.5" marker-end="url(#aGray)"/>
  <path d="M610,762 V830 H1245" fill="none" stroke="#6b7f75" stroke-width="2.5"/>

  <!-- Legend -->
  <line x1="30" y1="730" x2="84" y2="730" stroke="#8fd12a" stroke-width="6"/>
  <text x="96" y="735" font-size="14" fill="#2a3a32">Nebius path (inference and sandbox)</text>
  <line x1="30" y1="760" x2="84" y2="760" stroke="#8fd12a" stroke-width="4" stroke-dasharray="9 6"/>
  <text x="96" y="765" font-size="14" fill="#2a3a32">Inside Nebius, sandbox agent to model</text>
  <line x1="30" y1="790" x2="84" y2="790" stroke="#6b7f75" stroke-width="2.5"/>
  <text x="96" y="795" font-size="14" fill="#2a3a32">Local or configured integration</text>
  <line x1="30" y1="820" x2="84" y2="820" stroke="#6b7f75" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="96" y="825" font-size="14" fill="#2a3a32">Optional remote control path</text>

  <text x="30" y="874" font-size="14" fill="#5b6e64">The model proposes; the daemon shows you the exact edit or command; approved work runs on your machine or in your private Nebius sandbox, and every model call leaves a receipt.</text>
</svg>
